# BuildStart.io customizations — layered on top of the official docker-compose.yml
# Loaded automatically by docker compose.

services:
  studio:
    # Expose Studio on host port 3030 by default (change using STUDIO_PORT env var)
    ports:
      - "${STUDIO_PORT:-3030}:3000"

  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    ports:
      - "${WAHA_PORT:-3001}:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: "NOWEB"
      WHATSAPP_HOOK_URL: "http://kong:8000/functions/v1/webhook-wsender"
      WHATSAPP_HOOK_EVENTS: "message,message.any,state.change,session.status"
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_API_KEY: "flexlearn_secret_key"

  functions:
    environment:
      # ── BuildStart.io edge function secrets ──────────────────────────────────
      AI_GENERATE_URL: ${AI_GENERATE_URL}
      BOT_API_KEY: ${BOT_API_KEY}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-flexlearn_secret_key}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_REGION: ${MINIO_REGION}
      WEBHOOK_URL_OVERRIDE: ${WEBHOOK_URL_OVERRIDE:-https://stolen-opt-paso-garmin.trycloudflare.com/functions/v1/webhook-wsender}

  storage:
    volumes:
      - storage-data:/var/lib/storage

volumes:
  storage-data:
    name: supabase_storage-data
